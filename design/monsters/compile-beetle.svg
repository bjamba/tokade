<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Compile Beetle — armored mechanical insect -->
  <!-- Shell -->
  <ellipse cx="50" cy="55" rx="32" ry="26" fill="{{DARK}}"/>
  <ellipse cx="50" cy="55" rx="28" ry="22" fill="{{PANTS}}"/>
  <ellipse cx="44" cy="48" rx="14" ry="10" fill="{{PANTS_LIGHT}}"/>
  <!-- Shell seam -->
  <rect x="49" y="35" width="2" height="44" fill="{{DARK}}"/>
  <!-- Head -->
  <ellipse cx="50" cy="30" rx="14" ry="10" fill="{{DARK}}"/>
  <circle cx="44" cy="28" r="3" fill="{{IRIS}}"/>
  <circle cx="56" cy="28" r="3" fill="{{IRIS}}"/>
  <!-- Antennae -->
  <path d="M 44 22 Q 38 12 32 8" stroke="{{DARK}}" stroke-width="2" fill="none"/>
  <path d="M 56 22 Q 62 12 68 8" stroke="{{DARK}}" stroke-width="2" fill="none"/>
  <!-- Legs -->
  <path d="M 22 60 L 12 70 M 22 70 L 14 80" stroke="{{DARK}}" stroke-width="2"/>
  <path d="M 78 60 L 88 70 M 78 70 L 86 80" stroke="{{DARK}}" stroke-width="2"/>
  <!-- Pincers -->
  <path d="M 44 22 L 40 16 M 56 22 L 60 16" stroke="{{HAIR}}" stroke-width="2"/>
</svg>

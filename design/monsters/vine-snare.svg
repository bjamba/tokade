<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Vine Snare — tangled plant predator -->
  <!-- Tangled vines -->
  <path d="M 10 90 Q 30 60 20 30 Q 30 50 40 70" stroke="{{SHIRT_DARK}}" stroke-width="4" fill="none"/>
  <path d="M 90 90 Q 70 60 80 30 Q 70 50 60 70" stroke="{{SHIRT_DARK}}" stroke-width="4" fill="none"/>
  <path d="M 50 90 Q 40 50 50 20" stroke="{{SHIRT}}" stroke-width="5" fill="none"/>
  <path d="M 50 90 Q 60 50 50 20" stroke="{{SHIRT}}" stroke-width="5" fill="none"/>
  <!-- Pod/maw -->
  <ellipse cx="50" cy="20" rx="20" ry="16" fill="{{SHIRT}}"/>
  <ellipse cx="44" cy="14" rx="10" ry="8" fill="{{SHIRT_LIGHT}}"/>
  <path d="M 35 25 Q 50 35 65 25" stroke="{{DARK}}" stroke-width="2.5" fill="none"/>
  <path d="M 40 20 L 45 28 M 50 22 L 50 30 M 60 20 L 55 28" stroke="{{WHITE}}" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="50" cy="14" r="3" fill="{{IRIS}}"/>
  <circle cx="50" cy="14" r="1.5" fill="{{DARK}}"/>
  <!-- Leaves -->
  <ellipse cx="20" cy="50" rx="6" ry="3" fill="{{SHIRT_LIGHT}}" transform="rotate(-30 20 50)"/>
  <ellipse cx="80" cy="50" rx="6" ry="3" fill="{{SHIRT_LIGHT}}" transform="rotate(30 80 50)"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Bazaar: striped market tents + lanterns -->
  <rect width="32" height="32" fill="{{HAIR}}"/>
  <!-- Ground -->
  <rect x="0" y="22" width="32" height="10" fill="{{PANTS}}"/>
  <!-- Left tent (red stripes) -->
  <path d="M 2 22 L 10 10 L 16 22 Z" fill="{{HAIR_DARK}}"/>
  <path d="M 4 22 L 10 14 L 12 22 Z" fill="{{IRIS}}"/>
  <rect x="6" y="18" width="2" height="4" fill="{{DARK}}"/>
  <!-- Right tent (yellow) -->
  <path d="M 16 22 L 22 12 L 30 22 Z" fill="{{SKIN_DARK}}"/>
  <path d="M 19 22 L 22 16 L 25 22 Z" fill="{{HAIR}}"/>
  <rect x="21" y="18" width="2" height="4" fill="{{DARK}}"/>
  <!-- Hanging lanterns -->
  <rect x="9" y="6" width="1" height="4" fill="{{DARK}}"/>
  <rect x="22" y="8" width="1" height="4" fill="{{DARK}}"/>
  <circle cx="9.5" cy="6" r="1.5" fill="{{IRIS}}"/>
  <circle cx="22.5" cy="8" r="1.5" fill="{{HAIR_DARK}}"/>
  <!-- Coins on ground -->
  <circle cx="14" cy="27" r="1" fill="{{HAIR}}"/>
  <circle cx="20" cy="29" r="1" fill="{{HAIR}}"/>
</svg>

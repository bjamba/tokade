<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Garden Village: trees + cottage -->
  <rect width="32" height="32" fill="{{SHIRT_LIGHT}}"/>
  <!-- Ground -->
  <rect x="0" y="22" width="32" height="10" fill="{{SHIRT}}"/>
  <!-- Tree (left) -->
  <rect x="3" y="18" width="2" height="6" fill="{{PANTS}}"/>
  <circle cx="4" cy="15" r="5" fill="{{SHIRT_DARK}}"/>
  <circle cx="2" cy="14" r="3" fill="{{SHIRT}}"/>
  <!-- Tree (right) -->
  <rect x="27" y="18" width="2" height="6" fill="{{PANTS}}"/>
  <circle cx="28" cy="15" r="5" fill="{{SHIRT_DARK}}"/>
  <circle cx="30" cy="14" r="3" fill="{{SHIRT}}"/>
  <!-- Cottage -->
  <rect x="11" y="18" width="10" height="10" fill="{{HAIR}}"/>
  <path d="M 9 18 L 16 12 L 23 18 Z" fill="{{PANTS_DARK}}"/>
  <rect x="14" y="22" width="3" height="6" fill="{{DARK}}"/>
  <rect x="18" y="20" width="2" height="2" fill="{{IRIS}}"/>
  <!-- Flowers -->
  <circle cx="8" cy="26" r="1" fill="{{HAIR_DARK}}"/>
  <circle cx="24" cy="26" r="1" fill="{{IRIS}}"/>
  <circle cx="16" cy="29" r="1" fill="{{WHITE}}"/>
</svg>

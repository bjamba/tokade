<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wilderness: dense forest + bones -->
  <rect width="32" height="32" fill="{{SHIRT_DARK}}"/>
  <!-- Ground -->
  <rect x="0" y="22" width="32" height="10" fill="{{PANTS_DARK}}"/>
  <!-- Dense trees -->
  <circle cx="4" cy="14" r="5" fill="{{SHIRT}}"/>
  <circle cx="12" cy="11" r="6" fill="{{SHIRT_DARK}}"/>
  <circle cx="22" cy="13" r="5" fill="{{SHIRT}}"/>
  <circle cx="28" cy="10" r="4" fill="{{SHIRT_DARK}}"/>
  <!-- Trunks -->
  <rect x="3" y="18" width="2" height="6" fill="{{PANTS}}"/>
  <rect x="11" y="16" width="2" height="8" fill="{{PANTS}}"/>
  <rect x="21" y="17" width="2" height="6" fill="{{PANTS}}"/>
  <rect x="27" y="13" width="2" height="10" fill="{{PANTS}}"/>
  <!-- Bones on ground -->
  <rect x="14" y="27" width="4" height="1" fill="{{WHITE}}"/>
  <circle cx="14" cy="27.5" r="1" fill="{{WHITE}}"/>
  <circle cx="18" cy="27.5" r="1" fill="{{WHITE}}"/>
  <!-- Glowing eyes in dark -->
  <circle cx="8" cy="25" r="0.6" fill="{{IRIS}}"/>
  <circle cx="9" cy="25" r="0.6" fill="{{IRIS}}"/>
</svg>

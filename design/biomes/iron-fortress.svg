<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Iron Fortress: castle silhouette + factory smokestack -->
  <rect width="32" height="32" fill="{{SHIRT_LIGHT}}"/>
  <!-- Ground -->
  <rect x="0" y="22" width="32" height="10" fill="{{HAIR_DARK}}"/>
  <!-- Castle base -->
  <rect x="4" y="14" width="24" height="14" fill="{{PANTS_DARK}}"/>
  <!-- Crenellation -->
  <rect x="4" y="12" width="3" height="2" fill="{{PANTS_DARK}}"/>
  <rect x="10" y="12" width="3" height="2" fill="{{PANTS_DARK}}"/>
  <rect x="16" y="12" width="3" height="2" fill="{{PANTS_DARK}}"/>
  <rect x="22" y="12" width="3" height="2" fill="{{PANTS_DARK}}"/>
  <!-- Gate -->
  <rect x="14" y="20" width="4" height="8" fill="{{DARK}}"/>
  <!-- Windows -->
  <rect x="8" y="18" width="2" height="2" fill="{{IRIS}}"/>
  <rect x="22" y="18" width="2" height="2" fill="{{IRIS}}"/>
  <!-- Smokestack -->
  <rect x="26" y="4" width="3" height="12" fill="{{DARK}}"/>
  <circle cx="28" cy="3" r="2" fill="{{SKIN_DARK}}"/>
  <circle cx="26" cy="2" r="1.5" fill="{{SKIN_DARK}}"/>
</svg>

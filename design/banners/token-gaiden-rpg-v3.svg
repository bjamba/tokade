<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 48" width="128" height="48" shape-rendering="crispEdges">
  <!-- Overworld snapshot — Tokegotchi on the map, town in distance -->
  <!-- Sky gradient (two-band) -->
  <rect width="128" height="20" fill="{{IRIS}}"/>
  <rect x="0" y="14" width="128" height="6" fill="{{HAIR}}" opacity="0.4"/>
  <!-- Sun (low / sunset) -->
  <circle cx="20" cy="14" r="5" fill="{{HAIR}}"/>
  <circle cx="20" cy="14" r="2" fill="{{WHITE}}"/>
  <!-- Distant mountains -->
  <path d="M 0 24 L 12 14 L 24 24 Z" fill="{{PANTS_DARK}}"/>
  <path d="M 18 24 L 30 12 L 42 24 Z" fill="{{PANTS}}"/>
  <path d="M 38 24 L 48 18 L 56 24 Z" fill="{{PANTS_DARK}}"/>
  <path d="M 24 16 L 30 12 L 34 16 Z" fill="{{WHITE}}"/>
  <!-- Ocean line -->
  <rect x="60" y="20" width="68" height="4" fill="{{IRIS}}"/>
  <!-- Continent land curve -->
  <path d="M 0 22 L 128 22 L 128 48 L 0 48 Z" fill="{{HAIR_DARK}}"/>
  <!-- Plains overlay -->
  <path d="M 0 26 L 128 26 L 128 48 L 0 48 Z" fill="{{SHIRT}}"/>
  <!-- Path winding -->
  <path d="M 8 46 Q 30 36 50 40 Q 80 44 110 32" stroke="{{HAIR}}"
        stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Town in middle distance -->
  <rect x="76" y="22" width="3" height="6" fill="{{PANTS}}"/>
  <path d="M 75 22 L 77.5 19 L 80 22 Z" fill="{{PANTS_DARK}}"/>
  <rect x="80" y="22" width="2" height="6" fill="{{PANTS}}"/>
  <rect x="83" y="20" width="3" height="8" fill="{{PANTS}}"/>
  <rect x="83" y="20" width="3" height="2" fill="{{PANTS_DARK}}"/>
  <!-- Trees -->
  <circle cx="40" cy="32" r="3" fill="{{SHIRT_DARK}}"/>
  <rect x="39" y="33" width="2" height="3" fill="{{PANTS}}"/>
  <circle cx="100" cy="36" r="3" fill="{{SHIRT_DARK}}"/>
  <rect x="99" y="37" width="2" height="3" fill="{{PANTS}}"/>
  <!-- Hero Tokegotchi center foreground -->
  <rect x="60" y="38" width="6" height="8" fill="{{SKIN}}"/>
  <circle cx="63" cy="36" r="4" fill="{{SKIN}}"/>
  <path d="M 60 34 L 62 30 L 63 34 Z" fill="{{HAIR}}"/>
  <path d="M 64 34 L 65 30 L 66 34 Z" fill="{{HAIR}}"/>
  <circle cx="62" cy="36" r="0.5" fill="{{DARK}}"/>
  <circle cx="64" cy="36" r="0.5" fill="{{DARK}}"/>
  <!-- Title plate -->
  <rect x="3" y="3" width="60" height="10" fill="{{DARK}}"/>
  <rect x="3" y="3" width="60" height="10" fill="none" stroke="{{HAIR}}" stroke-width="0.5"/>
  <text x="33" y="9" font-family="monospace" font-size="5" font-weight="bold"
        text-anchor="middle" fill="{{HAIR}}">TOKEN GAIDEN</text>
  <text x="33" y="12" font-family="monospace" font-size="3" font-weight="bold"
        text-anchor="middle" fill="{{WHITE}}">- RPG -</text>
</svg>

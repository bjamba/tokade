<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="600" height="600" shape-rendering="geometricPrecision">

  <!-- DRAFT v1 — base Tokegotchi, no cosmetics. -->
  <!-- Authoring at 100x100; in-app we'll rasterize at ~24x24 with nearest-neighbor upscale for the 8-bit feel. -->

  <!-- Legs -->
  <rect x="40" y="75" width="8" height="15" fill="#5BA9BA"/>
  <rect x="52" y="75" width="8" height="15" fill="#5BA9BA"/>

  <!-- Feet -->
  <ellipse cx="44" cy="91" rx="6" ry="3" fill="#5BA9BA"/>
  <ellipse cx="56" cy="91" rx="6" ry="3" fill="#5BA9BA"/>

  <!-- Body -->
  <ellipse cx="50" cy="65" rx="18" ry="17" fill="#5BA9BA"/>

  <!-- Arms (stubby, hanging at sides) -->
  <ellipse cx="28" cy="60" rx="5" ry="11" fill="#5BA9BA"/>
  <ellipse cx="72" cy="60" rx="5" ry="11" fill="#5BA9BA"/>

  <!-- Head -->
  <circle cx="50" cy="35" r="22" fill="#5BA9BA"/>

  <!-- Belly highlight (lighter shade) -->
  <ellipse cx="50" cy="68" rx="9" ry="9" fill="#7FC1CE" opacity="0.55"/>

  <!-- Hair: Claude-petal trio. Left tilts in, center upright, right tilts in. -->
  <ellipse cx="37" cy="14" rx="3.5" ry="7" fill="#D97757" transform="rotate(-22 37 14)"/>
  <ellipse cx="50" cy="9"  rx="3.5" ry="9" fill="#D97757"/>
  <ellipse cx="63" cy="14" rx="3.5" ry="7" fill="#D97757" transform="rotate(22 63 14)"/>

  <!-- Eyes -->
  <circle cx="42" cy="35" r="3.2" fill="#1A1A2E"/>
  <circle cx="58" cy="35" r="3.2" fill="#1A1A2E"/>

  <!-- Eye highlights -->
  <circle cx="43" cy="34" r="1" fill="#FFFFFF"/>
  <circle cx="59" cy="34" r="1" fill="#FFFFFF"/>

  <!-- Mouth -->
  <path d="M 44 47 Q 50 51 56 47" stroke="#1A1A2E" stroke-width="2" fill="none" stroke-linecap="round"/>

</svg>

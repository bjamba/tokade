<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="900" height="1350">

  <!-- ANATOMY OVERLAY v2 — region + anchor map for the v3 base sprite. -->
  <!-- Convention: LEFT / RIGHT are from the Tokegotchi's perspective. -->
  <!-- All cosmetic SVGs must use viewBox="0 0 100 150" so they align. -->

  <defs>
    <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#EFEFEF" stroke-width="0.12"/>
    </pattern>
    <pattern id="grid-coarse" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#D0D0D0" stroke-width="0.25"/>
    </pattern>
  </defs>
  <rect width="100" height="150" fill="white"/>
  <rect width="100" height="150" fill="url(#grid)"/>
  <rect width="100" height="150" fill="url(#grid-coarse)"/>

  <!-- ============ Faint reference silhouette of v3 base ============ -->
  <g opacity="0.22">
    <!-- legs -->
    <rect x="36" y="106" width="11" height="30" rx="3" fill="#C7A5D9"/>
    <rect x="53" y="106" width="11" height="30" rx="3" fill="#C7A5D9"/>
    <ellipse cx="41.5" cy="138" rx="7" ry="4" fill="#C7A5D9"/>
    <ellipse cx="58.5" cy="138" rx="7" ry="4" fill="#C7A5D9"/>
    <!-- pants -->
    <rect x="36" y="106" width="11" height="32" rx="3" fill="#5C4033"/>
    <rect x="53" y="106" width="11" height="32" rx="3" fill="#5C4033"/>
    <!-- arms -->
    <rect x="25" y="65" width="9" height="40" rx="4" fill="#C7A5D9"/>
    <rect x="66" y="65" width="9" height="40" rx="4" fill="#C7A5D9"/>
    <!-- torso (covered) -->
    <rect x="32" y="62" width="36" height="48" rx="8" fill="#C7A5D9"/>
    <!-- shirt -->
    <rect x="32" y="64" width="36" height="42" rx="6" fill="#5A7F3F"/>
    <ellipse cx="30" cy="66" rx="8" ry="6" fill="#5A7F3F"/>
    <ellipse cx="70" cy="66" rx="8" ry="6" fill="#5A7F3F"/>
    <!-- head -->
    <circle cx="50" cy="38" r="23" fill="#C7A5D9"/>
    <!-- horns -->
    <ellipse cx="40" cy="10" rx="3.5" ry="9" fill="#E8DCC4" transform="rotate(-15 40 10)"/>
    <ellipse cx="60" cy="10" rx="3.5" ry="9" fill="#E8DCC4" transform="rotate(15 60 10)"/>
  </g>

  <!-- ============ Region overlays ============ -->

  <!-- HORN / HAT slot (above head) -->
  <rect x="32" y="0" width="36" height="20" fill="#E8DCC4" fill-opacity="0.10"
        stroke="#A89473" stroke-width="0.45" stroke-dasharray="1.3,0.8"/>
  <text x="33" y="3.5" font-size="2.6" font-family="monospace" fill="#8E7C5C" font-weight="bold">HORN / HAT</text>

  <!-- HEAD -->
  <rect x="26" y="15" width="48" height="48" fill="#E64C4C" fill-opacity="0.05"
        stroke="#E64C4C" stroke-width="0.5" stroke-dasharray="1.5,1"/>
  <text x="27" y="61" font-size="2.8" font-family="monospace" fill="#E64C4C" font-weight="bold">HEAD</text>

  <!-- EYEWEAR slot -->
  <rect x="36" y="34" width="28" height="14" fill="#F0A500" fill-opacity="0.08"
        stroke="#F0A500" stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <text x="37" y="36.8" font-size="2.2" font-family="monospace" fill="#B07500" font-weight="bold">EYEWEAR</text>

  <!-- MOUTH -->
  <rect x="44" y="51" width="12" height="7" fill="none"
        stroke="#C04080" stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <text x="56.5" y="55.5" font-size="2.2" font-family="monospace" fill="#C04080" font-weight="bold">mouth</text>

  <!-- SHIRT / TORSO (covers torso block + sleeve caps) -->
  <rect x="20" y="60" width="60" height="46" fill="#3D7BB5" fill-opacity="0.06"
        stroke="#3D7BB5" stroke-width="0.5" stroke-dasharray="1.5,1"/>
  <text x="21" y="63" font-size="2.6" font-family="monospace" fill="#3D7BB5" font-weight="bold">SHIRT (+sleeves)</text>

  <!-- BELT slot (separate cosmetic on top of shirt) -->
  <rect x="32" y="95" width="36" height="7" fill="none"
        stroke="#8B6F47" stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <text x="69" y="100" font-size="2.2" font-family="monospace" fill="#8B6F47" font-weight="bold">BELT</text>

  <!-- R-ARM (forearm below sleeve) -->
  <rect x="24" y="73" width="11" height="34" fill="#2E9B47" fill-opacity="0.08"
        stroke="#2E9B47" stroke-width="0.4" stroke-dasharray="1.2,0.8"/>
  <text x="11" y="91" font-size="2.4" font-family="monospace" fill="#2E9B47" font-weight="bold">R-ARM</text>

  <!-- L-ARM -->
  <rect x="65" y="73" width="11" height="34" fill="#2E9B47" fill-opacity="0.08"
        stroke="#2E9B47" stroke-width="0.4" stroke-dasharray="1.2,0.8"/>
  <text x="77" y="91" font-size="2.4" font-family="monospace" fill="#2E9B47" font-weight="bold">L-ARM</text>

  <!-- PANTS (full leg length) -->
  <rect x="34" y="104" width="32" height="36" fill="#7B4CC0" fill-opacity="0.07"
        stroke="#7B4CC0" stroke-width="0.5" stroke-dasharray="1.5,1"/>
  <text x="67" y="123" font-size="2.6" font-family="monospace" fill="#7B4CC0" font-weight="bold">PANTS</text>

  <!-- FEET / SHOES -->
  <rect x="34" y="134" width="32" height="10" fill="#8B5A2B" fill-opacity="0.10"
        stroke="#8B5A2B" stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <text x="67" y="142" font-size="2.4" font-family="monospace" fill="#8B5A2B" font-weight="bold">FEET / SHOE</text>

  <!-- ============ Anchor points (magenta dots) ============ -->
  <g fill="#FF00AA" stroke="#FF00AA">
    <circle cx="50" cy="6" r="0.8"/>
    <text x="51" y="6.5" font-size="2.2" font-family="monospace">head-top</text>

    <circle cx="50" cy="25" r="0.8"/>
    <text x="51" y="25.5" font-size="2.2" font-family="monospace">forehead</text>

    <circle cx="50" cy="60" r="0.8"/>
    <text x="51" y="60.5" font-size="2.2" font-family="monospace">neck (collar)</text>

    <circle cx="50" cy="80" r="0.8"/>
    <text x="51" y="80.5" font-size="2.2" font-family="monospace">back (cape)</text>

    <circle cx="50" cy="98" r="0.8"/>
    <text x="51" y="98.5" font-size="2.2" font-family="monospace">waist (belt-buckle)</text>

    <circle cx="29" cy="106" r="0.8"/>
    <text x="11" y="106.5" font-size="2.2" font-family="monospace">R-hand</text>

    <circle cx="71" cy="106" r="0.8"/>
    <text x="72" y="106.5" font-size="2.2" font-family="monospace">L-hand</text>

    <circle cx="41.5" cy="142" r="0.8"/>
    <circle cx="58.5" cy="142" r="0.8"/>
    <text x="62" y="146" font-size="2.2" font-family="monospace">feet (shoe anchor)</text>
  </g>

</svg>

<ellipse cx="73" cy="65" rx="3" ry="4" fill="{{SHIRT_DARK}}"/>
<rect x="22" y="70" width="8" height="2" fill="{{SHIRT_DARK}}"/>
<rect x="70" y="70" width="8" height="2" fill="{{SHIRT_DARK}}"/>

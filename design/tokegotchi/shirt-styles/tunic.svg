  <rect x="32" y="64" width="36" height="42" fill="{{SHIRT}}"/>
  <rect x="32" y="64" width="10" height="42" fill="{{SHIRT_LIGHT}}"/>
  <rect x="58" y="64" width="10" height="42" fill="{{SHIRT_DARK}}"/>
  <rect x="32" y="64" width="36" height="5" fill="{{SHIRT_DARK}}"/>
</g>

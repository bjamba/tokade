<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -18 100 168" width="512" height="864" shape-rendering="geometricPrecision">

  <!-- TOKEGOTCHI BASE — v3 -->
  <!-- 32x48 source resolution. FFVI-ish proportions. Named part groups for rigging. -->
  <!-- Every color region has light + mid + dark for pixel-art form. Horns replace hair. -->

  <defs>
    <clipPath id="head-clip"><circle cx="50" cy="38" r="23"/></clipPath>
    <clipPath id="shirt-clip"><rect x="32" y="64" width="36" height="42" rx="6"/></clipPath>
    <clipPath id="pants-clip-r"><rect x="36" y="106" width="11" height="32" rx="3"/></clipPath>
    <clipPath id="pants-clip-l"><rect x="53" y="106" width="11" height="32" rx="3"/></clipPath>
    <clipPath id="arm-clip-r"><rect x="25" y="65" width="9" height="40" rx="4"/></clipPath>
    <clipPath id="arm-clip-l"><rect x="66" y="65" width="9" height="40" rx="4"/></clipPath>
  </defs>

  <!-- ============ CAPE (cosmetic — z-behind everything) ============ -->
  <g id="cape">
    
  </g>

  <!-- ============ LEGS (animatable via _LEG_TRANSFORM) ============ -->
  <g id="r-leg" transform="translate(0,0)">
    <rect x="36" y="106" width="11" height="30" rx="3" fill="#C7A5D9"/>
    <ellipse cx="41.5" cy="138" rx="7" ry="4" fill="#C7A5D9"/>
    <ellipse cx="44" cy="139" rx="4" ry="2.5" fill="#A07AB8"/>
  </g>
  <g id="l-leg" transform="translate(0,-3.125)">
    <rect x="53" y="106" width="11" height="30" rx="3" fill="#C7A5D9"/>
    <ellipse cx="58.5" cy="138" rx="7" ry="4" fill="#C7A5D9"/>
    <ellipse cx="61" cy="139" rx="4" ry="2.5" fill="#A07AB8"/>
  </g>

  <!-- ============ PANTS (swappable) ============ -->
  <g id="pants">
    <!-- PANTS STYLE: long-pants — default long brown trousers with shading. -->
<g clip-path="url(#pants-clip-r)">
  <rect x="36" y="106" width="11" height="32" fill="#5C4033"/>
  <rect x="36" y="106" width="4" height="32" fill="#7C5C45"/>
  <rect x="43" y="106" width="4" height="32" fill="#3D2920"/>
  <rect x="36" y="134" width="11" height="4" fill="#3D2920"/>
</g>
<g clip-path="url(#pants-clip-l)">
  <rect x="53" y="106" width="11" height="32" fill="#5C4033"/>
  <rect x="53" y="106" width="4" height="32" fill="#7C5C45"/>
  <rect x="60" y="106" width="4" height="32" fill="#3D2920"/>
  <rect x="53" y="134" width="11" height="4" fill="#3D2920"/>
</g>

  </g>

  <!-- ============ ARMS (with shading) ============ -->
  <!-- Arms animatable via _ARM_TRANSFORM (pivot at shoulder). Clip-paths removed so rotation works cleanly. -->
  <g id="r-arm" transform="rotate(-8 32 65)">
    <ellipse cx="32" cy="65" rx="7" ry="5" fill="#C7A5D9"/>
    <rect x="25" y="65" width="9" height="40" rx="4" fill="#C7A5D9"/>
    <rect x="25" y="65" width="3" height="40" fill="#DBC1E8"/>
    <rect x="31" y="65" width="3" height="40" fill="#A07AB8"/>
  </g>
  <g id="l-arm" transform="rotate(-8 68 65)">
    <ellipse cx="68" cy="65" rx="7" ry="5" fill="#C7A5D9"/>
    <rect x="66" y="65" width="9" height="40" rx="4" fill="#C7A5D9"/>
    <rect x="66" y="65" width="3" height="40" fill="#DBC1E8"/>
    <rect x="72" y="65" width="3" height="40" fill="#A07AB8"/>
  </g>

  <!-- ============ TORSO ============ -->
  <g id="torso">
    <rect x="32" y="62" width="36" height="48" rx="8" fill="#C7A5D9"/>
  </g>

  <!-- ============ SHIRT (swappable) ============ -->
  <g id="shirt">
    <!-- SHIRT STYLE: tunic — default forest-green tunic with shading. -->
<g clip-path="url(#shirt-clip)">
  <rect x="32" y="64" width="36" height="42" fill="#5A7F3F"/>
  <rect x="32" y="64" width="10" height="42" fill="#7DA055"/>
  <rect x="58" y="64" width="10" height="42" fill="#3F5A2A"/>
  <rect x="32" y="64" width="36" height="5" fill="#3F5A2A"/>
</g>
<ellipse cx="30" cy="66" rx="8" ry="6" fill="#5A7F3F"/>
<ellipse cx="70" cy="66" rx="8" ry="6" fill="#5A7F3F"/>
<ellipse cx="27" cy="65" rx="3" ry="4" fill="#7DA055"/>
<ellipse cx="73" cy="65" rx="3" ry="4" fill="#3F5A2A"/>
<rect x="22" y="70" width="8" height="2" fill="#3F5A2A"/>
<rect x="70" y="70" width="8" height="2" fill="#3F5A2A"/>

  </g>

  <!-- ============ BELT (swappable, drawn on top of shirt) ============ -->
  <g id="belt">
    <!-- BELT STYLE: leather — default brown belt with dark buckle. -->
<rect x="32" y="96" width="36" height="5" fill="#8B6F47"/>
<rect x="32" y="100" width="36" height="1" fill="#1A1A2E"/>
<rect x="47" y="96" width="6" height="5" fill="#1A1A2E"/>
<rect x="48" y="97" width="4" height="3" fill="#8B6F47"/>

  </g>

  <!-- ============ HEAD + HAIR + HAT (animated as a single unit via HEAD_TRANSFORM) ============ -->
  <g id="head" transform="translate(0,1.5)">
    <!-- base head -->
    <circle cx="50" cy="38" r="23" fill="#C7A5D9"/>
    <!-- shading clipped to head -->
    <g clip-path="url(#head-clip)">
      <ellipse cx="38" cy="26" rx="11" ry="8" fill="#DBC1E8"/>          <!-- top-left highlight -->
      <ellipse cx="60" cy="48" rx="14" ry="10" fill="#A07AB8"/>          <!-- bottom-right shadow -->
      <ellipse cx="50" cy="58" rx="18" ry="4" fill="#A07AB8"/>           <!-- chin shadow band -->
    </g>

    <!-- Eyes: sclera + iris + pupil + highlight -->
    <ellipse cx="42" cy="40" rx="6" ry="8" fill="#FFFFFF"/>
    <ellipse cx="58" cy="40" rx="6" ry="8" fill="#FFFFFF"/>
    <ellipse cx="42" cy="41" rx="3.6" ry="5.2" fill="#4A7BC5"/>
    <ellipse cx="58" cy="41" rx="3.6" ry="5.2" fill="#4A7BC5"/>
    <circle  cx="42" cy="42" r="1.5" fill="#1A1A2E"/>
    <circle  cx="58" cy="42" r="1.5" fill="#1A1A2E"/>
    <circle  cx="40" cy="38" r="1.5" fill="#FFFFFF"/>
    <circle  cx="56" cy="38" r="1.5" fill="#FFFFFF"/>

    <!-- Mouth -->
    <ellipse cx="50" cy="54" rx="5" ry="2" fill="#1A1A2E"/>

    <!-- Eyewear (cosmetic — z-above face, below hair) -->
    <g id="eyewear">
      
    </g>

    <!-- Hair (swappable via HAIR_STYLE) -->
    <g id="hair">
      <!-- HAIR STYLE: horns — two curved ivory horns rising from head. Default. -->
<ellipse cx="40" cy="10" rx="3.5" ry="9" fill="#E8DCC4" transform="rotate(-15 40 10)"/>
<ellipse cx="41.5" cy="11" rx="1.8" ry="7.5" fill="#A89473" transform="rotate(-15 41.5 11)"/>
<ellipse cx="60" cy="10" rx="3.5" ry="9" fill="#E8DCC4" transform="rotate(15 60 10)"/>
<ellipse cx="61.5" cy="11" rx="1.8" ry="7.5" fill="#A89473" transform="rotate(15 61.5 11)"/>

    </g>

    <!-- Hat (cosmetic — z-above hair) -->
    <g id="hat">
      
    </g>
  </g>

  <!-- ============ HELD ITEMS (front of everything) ============ -->
  <g id="held-r">
    
  </g>
  <g id="held-l">
    
  </g>

</svg>

name: Release

# Trigger on push of a tag like v0.2.0 or v1.0.0-rc1.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the Release and upload assets

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Match the Xcode pin in ci.yml so release builds match CI builds.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show Swift version
        run: swift --version

      - name: Build .app
        run: ./build.sh

      - name: Test
        run: swift test

      - name: Guardrail checks
        run: ./scripts/check.sh

      - name: Zip the .app
        run: |
          # Tag like refs/tags/v0.2.0 → 0.2.0
          TAG="${GITHUB_REF##refs/tags/}"
          ZIP_NAME="Tokade-${TAG}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "Tokade.app" "${ZIP_NAME}"
          shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create Release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"  # v0.2.0 → 0.2.0 (matches CHANGELOG header style)
          # Pull the matching section from CHANGELOG.md if present, otherwise
          # let gh auto-generate from PRs since the previous tag.
          NOTES_FILE="$(mktemp)"
          awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md \
            | sed '$d' \
            | tail -n +2 > "$NOTES_FILE" || true

          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              "${ZIP_NAME}" "${ZIP_NAME}.sha256" \
              --title "Tokade ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$TAG" \
              "${ZIP_NAME}" "${ZIP_NAME}.sha256" \
              --title "Tokade ${TAG}" \
              --generate-notes \
              --verify-tag
          fi

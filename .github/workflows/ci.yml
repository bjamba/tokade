name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pin Xcode so an Apple update doesn't silently change Swift semantics.
      # Bump this version intentionally when adopting newer Swift features.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: swiftformat lint
        run: |
          brew install swiftformat
          swiftformat --lint .

      - name: Guardrail checks
        run: ./scripts/check.sh
